   <label class="f c6">Notizen<textarea id="uX" rows="2">${esc(u.notes||'')}</textarea></label></div><p class="hint">Personenbezogene Daten – nur für die Verwaltung der Gemeinschaft verwenden.</p>`,
   {footer:`<button class="btn" data-no>Abbrechen</button><button class="btn pri" data-yes>Speichern</button>`});
  ov.querySelector('[data-no]').onclick=()=>closeModal(ov);
  ov.querySelector('[data-yes]').onclick=async()=>{Object.assign(u,{owner:$('#uO',ov).value.trim(),usage:$('#uN',ov).value,address:$('#uA',ov).value.trim(),email:$('#uE',ov).value.trim(),phone:$('#uT',ov).value.trim(),iban:$('#uI',ov).value.trim().replace(/\s+/g,' '),tenant:$('#uM',ov).value.trim(),notes:$('#uX',ov).value.trim()});await saveSettings();closeModal(ov);toast('Gespeichert');render()};
}
function adminPanel(){const s=S.settings;const f=(k,l,ph='',t='text',c='c2')=>`<label class="f ${c}">${l}<input data-set="${k}" type="${t}" value="${esc(s[k]??'')}" placeholder="${esc(ph)}"></label>`;
  return `<details class="panel" style="margin-bottom:16px" ${s.verwName?'':'open'}><summary style="cursor:pointer;font-weight:650">Verwaltung, Bankverbindung und Hausgeld-Fälligkeit</summary>
   <div class="form" style="margin-top:12px">${f('wegName','Name der WEG','WEG Lindenstraße 8','text','c3')}${f('verwName','Verwalter/in','Name','text','c3')}${f('verwAddr','Anschrift Verwaltung','Straße, PLZ Ort','text','c3')}${f('verwPhone','Telefon','','tel')}${f('verwMail','E-Mail','','email','c1" style="grid-column:span 1')}
   ${f('bankHolder','Kontoinhaber','Gemeinschaft der Wohnungseigentümer …','text','c3')}${f('bankIban','IBAN Hausgeldkonto','DE..','text','c3')}${f('bankBic','BIC')}${f('bankName','Bank')}${f('hgDueDay','Hausgeld fällig zum Tag','5','number')}</div></details>`}
function bindAdminPanel(){$$('[data-set]').forEach(el=>el.addEventListener('change',async()=>{S.settings[el.dataset.set]=el.type==='number'?num(el.value):el.value.trim();await saveSettings();renderNav();toast('Gespeichert')}))}

/* ---------- Erweiterungen bestehender Funktionen ---------- */
const _calItems=calItems;
calItems=function(from,to){const it=_calItems(from,to),t=today();
  S.meetings.forEach(m=>{if(m.date>=from&&m.date<=to)it.push({date:m.date,cls:m.status==='durchgeführt'?'':'own',label:`${m.time?m.time+' ':''}Eigentümerversammlung`,act:'meetingForm',id:m.id});
    const dl=addDays(m.date,-21);if(m.status==='geplant'&&!m.inviteSentAt&&dl>=from&&dl<=to)it.push({date:dl,cls:dl<t?'over':'due',label:'Einladung Versammlung versenden',act:'meetingForm',id:m.id})});
  return it.sort((a,b)=>a.date<b.date?-1:1)};
const _reminders=reminders;
reminders=function(){const out=_reminders(),t=today();
  S.meetings.filter(m=>m.status==='geplant'&&!m.inviteSentAt).forEach(m=>{const dl=addDays(m.date,-21);if(addDays(dl,-10)<=t)out.push({kind:dl<t?'over':'due',date:dl,title:'Einladung zur Eigentümerversammlung',text:`Versammlung am ${fd(m.date)} – Einladung bis ${fd(dl)}`,act:'meetingForm',id:m.id})});
  return out.sort((a,b)=>a.date<b.date?-1:1)};
const _loadDemo=loadDemoData;
loadDemoData=async function(){await _loadDemo();
  const Y=new Date().getFullYear(),PY=Y-1,us=units(),zc=zufCatId();
  for(const [y,f,dec] of [[PY,1.0,`${PY-1}-11-20`],[Y,1.04,`${PY}-11-18`]]){const lines={};Object.entries(groupSum(costsOfYear(PY).filter(c=>isActual(c)&&!c.fromReserve),c=>c.categoryId)).forEach(([id,v])=>{if(id!==zc&&v>0)lines[id]=Math.ceil(v*f/10)*10});
    if(!planOf(y))await save('plans',{id:'wp-'+y,year:y,status:'beschlossen',decidedAt:dec,fromMonth:1,lines,zufuehrung:12000,override:{},notes:'',isDemo:true})}
  for(const y of [PY,Y]){const due=monthsDue(y);for(const [i,u] of us.entries())for(let m=0;m<due;m++){if(y===Y&&i===us.length-1&&m>=due-2)continue;const s=sollMonth(u.id,y,m);const a=y===Y&&i===1&&m===due-1?r2(s/2):s;if(a>0)await save('receipts',{unitId:u.id,date:iso(new Date(y,m,Math.min(dueDay(),3))),amount:a,type:'Hausgeld',forYear:y,note:`Hausgeld ${MONTHS[m]} ${y}`,isDemo:true})}}
  const ev=S.events.find(e=>e.isDemo&&e.title==='Eigentümerversammlung');if(ev)await removeRec('events',ev.id);
  const past={date:`${Y}-04-24`,time:'19:00',place:'Gemeinschaftsraum',type:'ordentlich',status:'durchgeführt',chair:'Verwaltung',writer:'',attendees:us.map(u=>u.id),inviteSentAt:`${Y}-03-28`,isDemo:true,
    tops:DEFAULT_TOPS.map(t=>({id:uid(),title:t,proposal:''}))};
  past.tops.splice(6,0,{id:uid(),title:'Fassadenanstrich Nordseite',proposal:'',text:'Anstrich der Nordfassade im Folgejahr, Kostenrahmen bis 19.000 € brutto, Finanzierung aus der Erhaltungsrücklage.',yes:4,no:0,abst:0,result:'angenommen'});
  Object.assign(past.tops[2],{text:`Die Jahresabrechnung ${PY} wird mit den Abrechnungsspitzen beschlossen.`,yes:4,no:0,abst:0,result:'angenommen'});
  Object.assign(past.tops[4],{text:'Der Verwaltung wird für das Jahr '+PY+' Entlastung erteilt.',yes:3,no:0,abst:1,result:'angenommen'});
  await save('meetings',past);
  const fr=S.resolutions.find(r=>r.isDemo&&/Fassade/.test(r.title));if(fr){Object.assign(fr,{meetingId:past.id,topId:past.tops[6].id,title:'TOP 7: Fassadenanstrich Nordseite'});await save('resolutions',fr)}
  for(const i of [2,4]){const t=past.tops[i];await save('resolutions',{date:past.date,title:`TOP ${i+1}: ${t.title}`,text:t.text,result:t.result,meetingId:past.id,topId:t.id,isDemo:true})}
  await save('meetings',{date:addDays(today(),35),time:'19:00',place:'Gemeinschaftsraum',type:'ordentlich',status:'geplant',tops:DEFAULT_TOPS.map(t=>({id:uid(),title:t,proposal:''})),attendees:[],chair:'',inviteSentAt:'',isDemo:true});
};
const _removeDemo=removeDemoData;
removeDemoData=async function(){for(const s of ['receipts','plans','meetings'])for(const x of S[s].filter(x=>x.isDemo))await removeRec(s,x.id);await _removeDemo()};
Object.assign(ACT,{
  hgPay:id=>receiptForm(null,id),hgShowAll:()=>{HG_SHOW.all=true;vHausgeld()},hgPayEdit:id=>receiptForm(id),hgBatch:()=>receiptBatch(),hgDun:id=>dunning(id),
  planCreate:m=>planCreate(m),planPrint:()=>planPrint(),
  planDelete:async()=>{const p=planOf(S.year);if(!await confirmBox(`Wirtschaftsplan ${S.year} löschen? Das Hausgeld-Soll für ${S.year} entfällt dann.`,{ok:'Löschen',danger:true}))return;await removeRec('plans',p.id);toast('Gelöscht');render()},
  jaPrint:k=>jaPrint(k),
  jaCsv:()=>{const j=jaCalc(S.year);download(`Jahresabrechnung-${S.year}.csv`,toCSV(j.rows.map(r=>({Einheit:r.u.name,Eigentuemer:r.u.owner||'',MEA:num(r.u.mea),Kostenanteil:r.costs,Ruecklage:r.zuf,Gesamtbelastung:r.total,Vorschuesse_Soll:r.soll,Abrechnungsspitze:r.spitze,Gezahlt:r.ist,Ergebnis:r.ergebnis,Umlagefaehig:r.uml,P35a_Dienstleistung:r.ld,P35a_Handwerk:r.lh}))),'text/csv;charset=utf-8')},
  meetingForm:id=>meetingForm(id),meetingInvite:id=>meetingInvite(id),meetingMinutes:id=>meetingMinutes(id),resPrint:()=>resPrint(),
  unitDetail:id=>unitDetail(id)
});

/* ---------- Start ---------- */
async function firstStart(skipAsk){
  S.settings={id:'settings',years:[new Date().getFullYear()],lastBackup:null,demoLoaded:false,wegName:'',units:defaultUnits(),catKeys:{},catCustom:{},createdAt:new Date().toISOString()};
  await saveSettings();await seedCategories();
  if(skipAsk)return;
  const ov=openModal('Willkommen im WEG Kostentracker',`<p style="margin-top:0">Die typischen Kostenkategorien einer WEG sind bereits angelegt. Möchtest du die App zuerst mit Beispieldaten ausprobieren?</p><p class="small muted">Beispieldaten sind überall deutlich als „Beispiel“ gekennzeichnet und lassen sich mit einem Klick wieder entfernen.</p>
   <label class="f" style="margin-top:10px">Name der WEG (optional)<input id="wN" class="inp" placeholder="z. B. WEG Lindenstraße 8"></label>`,{footer:`<button class="btn" data-empty>Leer starten</button><button class="btn pri" data-demo>Mit Beispieldaten starten</button>`});
  await new Promise(res=>{
    ov.querySelector('[data-empty]').onclick=async()=>{S.settings.wegName=$('#wN',ov).value.trim();await saveSettings();closeModal(ov);res()};
    ov.querySelector('[data-demo]').onclick=async()=>{S.settings.wegName=$('#wN',ov).value.trim();await saveSettings();ov.querySelector('[data-demo]').disabled=true;ov.querySelector('[data-demo]').textContent='Lädt …';await loadDemoData();closeModal(ov);res()};
    ov.querySelector('[data-close]').onclick=()=>{closeModal(ov);res()};
  });
}
async function init(){
  try{await openDB();await loadAll();
    if(!S.settings)await firstStart();
    S.settings.years=S.settings.years||[];if(!S.settings.units){S.settings.units=defaultUnits();S.settings.catKeys={};S.settings.catCustom={};await saveSettings()}
    try{if(navigator.storage?.persist&&!(await navigator.storage.persisted()))navigator.storage.persist()}catch(e){}
    window.addEventListener('hashchange',route);route();
  }catch(e){console.error(e);$('#main').innerHTML=`<div class="notice bad"><div class="grow"><b>Die Datenbank konnte nicht geöffnet werden.</b><br>${esc(e.message)}<br><span class="small">Bitte die Datei in einem aktuellen Chrome, Edge oder Firefox öffnen und nicht im privaten Modus.</span></div></div>`}
}
$('#burger').onclick=()=>$('#side').classList.toggle('open');
document.addEventListener('click',e=>{if(window.innerWidth<=860&&$('#side').classList.contains('open')&&!e.target.closest('#side')&&!e.target.closest('#burger'))$('#side').classList.remove('open')});
init();
</script>

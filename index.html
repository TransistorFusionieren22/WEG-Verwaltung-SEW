<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WEG Hausverwaltung</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231f4e79'/><path d='M7 15l9-7 9 7v10H7z' fill='%23e8b931'/></svg>">
<style>
:root{
  --bg:#eef1f4;--panel:#ffffff;--ink:#1a2735;--muted:#5d6b79;--line:#d8dee5;--line2:#e8ecf0;
  --navy:#1f4e79;--navy-ink:#ffffff;--navy-soft:#e5edf6;--tab:#e8b931;--tab-ink:#3b2d00;
  --side:#172636;--side-ink:#b9c6d3;--side-hi:#ffffff;
  --ok:#1d7a46;--ok-bg:#e3f3e9;--warn:#9a5b00;--warn-bg:#fdf1d8;--bad:#b3261e;--bad-bg:#fbe7e5;
  --info:#1f4e79;--info-bg:#e5edf6;--plan:#5b3fa0;--plan-bg:#eee8fa;--grey:#5d6b79;--grey-bg:#eceff2;
  --r:8px;--r-lg:12px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10171e;--panel:#18222c;--ink:#e3e9ef;--muted:#93a2b1;--line:#2b3946;--line2:#22303c;
  --navy:#5b9bd5;--navy-ink:#0c1620;--navy-soft:#1c2f42;--tab:#e8b931;--tab-ink:#2d2200;
  --side:#0b1218;--side-ink:#8fa0b0;
  --ok:#5ccf8c;--ok-bg:#143322;--warn:#f0b257;--warn-bg:#3a2a10;--bad:#f2837a;--bad-bg:#3d1a17;
  --info:#8dbbe8;--info-bg:#1c2f42;--plan:#b9a0f0;--plan-bg:#2a2145;--grey:#93a2b1;--grey-bg:#24303b;
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);font-size:15px;line-height:1.45;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--navy)}
:focus-visible{outline:2px solid var(--tab);outline-offset:2px}
.num,td.num,.kpi b{font-variant-numeric:tabular-nums}
#app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
#side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:18px 18px 14px;color:var(--side-hi)}
.brand svg{flex:none}
.brand b{display:block;font-size:14.5px;letter-spacing:0;white-space:nowrap}
.brand>div{min-width:0}
.brand small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand small{display:block;font-size:12px;color:var(--side-ink)}
#nav{display:flex;flex-direction:column;padding:6px 10px 16px;gap:1px}
#nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:var(--side-ink);text-decoration:none;font-size:14px}
#nav a:hover{background:rgba(255,255,255,.06);color:var(--side-hi)}
#nav a.on{background:rgba(232,185,49,.14);color:var(--side-hi);box-shadow:inset 3px 0 0 var(--tab)}
#nav a .cnt{margin-left:auto;background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;font-weight:600}
#nav .sep{height:1px;background:rgba(255,255,255,.08);margin:8px 6px}
.side-foot{margin-top:auto;padding:14px 18px;font-size:12px;border-top:1px solid rgba(255,255,255,.08)}
.side-foot .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#5ccf8c;margin-right:6px}
#wrap{min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:flex-end;gap:12px;padding:12px 24px 0}
#top h1{font-size:20px;margin:0 0 12px;font-weight:650;letter-spacing:-.01em}
#burger{display:none;background:none;border:0;padding:6px;margin:0 0 8px;cursor:pointer}
.top-right{margin-left:auto;display:flex;align-items:flex-end;gap:10px}
/* Jahresregister – die Ordner-Reiter */
.reg{display:flex;gap:2px;align-items:flex-end}
.reg button{border:1px solid var(--line);border-bottom:0;background:var(--panel);color:var(--muted);padding:6px 12px 7px;border-radius:7px 7px 0 0;cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums;font-size:14px}
.reg button.on{background:var(--tab);color:var(--tab-ink);border-color:var(--tab);padding-top:9px}
.reg button.add{font-weight:700;padding:6px 10px 7px}
#main{padding:22px 24px 60px;max-width:1400px;width:100%}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:7px 13px;border-radius:var(--r);cursor:pointer;font-size:14px;font-weight:550;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.danger{color:var(--bad);border-color:var(--bad-bg)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--grey-bg)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.mb-top{margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-dash{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px}
.panel h2{font-size:16px;margin:0 0 12px;font-weight:650}
.panel h3{font-size:14px;margin:16px 0 8px;font-weight:650}
.panel .sub{color:var(--muted);font-size:13px;margin:-8px 0 12px}
.muted{color:var(--muted)}
.small{font-size:13px}
/* Kennzahlen – Ordnerrücken-Optik */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px 14px 20px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c,var(--navy))}
.kpi span{display:block;font-size:13px;color:var(--muted)}
.kpi b{display:block;font-size:22px;font-weight:700;letter-spacing:-.01em;margin:2px 0}
.kpi em{font-style:normal;font-size:12.5px;color:var(--muted)}
.kpi em.up{color:var(--bad)} .kpi em.down{color:var(--ok)}
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.hero .big{font-size:40px;font-weight:750;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.stack-bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--grey-bg);margin:14px 0 8px}
.stack-bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel);position:sticky;top:0}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--ink)}
td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--navy-soft)}
td.num,th.num{text-align:right;white-space:nowrap}
tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel)}
.tbl-wrap table th:first-child,.tbl-wrap table td:first-child{padding-left:16px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--grey-bg);color:var(--grey)}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-info{background:var(--info-bg);color:var(--info)}.b-plan{background:var(--plan-bg);color:var(--plan)}
.b-demo{background:transparent;border:1px dashed var(--muted);color:var(--muted);font-weight:500}
.tag{font-size:12px;color:var(--muted);margin-left:4px}
.t-title{font-weight:600}
.t-sub{font-size:12.5px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line2)}
.list li:last-child{border-bottom:0}
.list .date{flex:none;width:52px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:3px 0;font-size:11px;line-height:1.15;color:var(--muted)}
.list .date b{display:block;font-size:17px;color:var(--ink)}
.list .grow{flex:1;min-width:0}
.list .right{text-align:right;white-space:nowrap}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:10px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:4px 12px;align-items:center;font-size:13.5px}
.hbar .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--grey-bg);margin-bottom:8px;overflow:hidden}
.hbar .bar i{display:block;height:100%;background:var(--navy);border-radius:3px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.notice{border:1px solid var(--line);border-left:4px solid var(--tab);background:var(--panel);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}
.notice.bad{border-left-color:var(--bad)}
.notice .grow{flex:1;min-width:200px}
/* Formulare */
.form{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px 14px}
.form .c2{grid-column:span 2}.form .c3{grid-column:span 3}.form .c4{grid-column:span 4}.form .c6{grid-column:1/-1}
.form fieldset{grid-column:1/-1;border:0;border-top:1px solid var(--line);margin:6px 0 0;padding:12px 0 0;display:contents}
.form .legend-h{grid-column:1/-1;font-weight:650;font-size:14px;margin-top:8px;padding-top:12px;border-top:1px solid var(--line)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
label.f input,label.f select,label.f textarea,.inp{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 10px;font-size:15px;color:var(--ink);width:100%;min-width:0}
label.f textarea{min-height:68px;resize:vertical}
label.f input:focus,label.f select:focus,label.f textarea:focus,.inp:focus{outline:2px solid var(--navy);outline-offset:-1px;border-color:var(--navy)}
label.f .req{color:var(--bad)}
label.f.err input,label.f.err select{border-color:var(--bad)}
.ferr{color:var(--bad);font-size:12px}
.hint{font-size:12.5px;color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.filters{display:grid;grid-template-columns:2fr repeat(5,minmax(0,1fr));gap:8px;margin-bottom:12px}
.filters .inp{padding:7px 9px;font-size:14px}
.filters-more{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:12px}
/* Upload */
.drop{border:2px dashed var(--line);border-radius:var(--r-lg);padding:16px;text-align:center;color:var(--muted);background:var(--bg)}
.drop.over{border-color:var(--navy);background:var(--navy-soft)}
.drop .row{justify-content:center;margin-top:8px}
.docs{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.doc{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;background:var(--panel)}
.doc .ico{flex:none;width:34px;height:40px;border-radius:4px;background:var(--navy-soft);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;overflow:hidden}
.doc .ico img{width:100%;height:100%;object-fit:cover}
.doc .grow{flex:1;min-width:0}
.doc .nm{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc .mt{font-size:12px;color:var(--muted)}
.star{color:var(--tab);font-size:16px}
.ocr{border:1px solid var(--navy);border-radius:var(--r);padding:12px;margin-top:10px;background:var(--navy-soft)}
.ocr table td{padding:4px 6px;border:0}
.ocr .inp{padding:5px 8px;font-size:14px}
.prog{height:6px;background:var(--grey-bg);border-radius:3px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--navy);width:0;transition:width .2s}
/* Modal */
#modals .ov{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto}
.modal{background:var(--panel);border-radius:var(--r-lg);width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;max-height:none}
.modal.wide{max-width:960px}
.modal header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal header h2{margin:0;font-size:17px;flex:1}
.modal .body{padding:16px 18px}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap;position:sticky;bottom:0;background:var(--panel);border-radius:0 0 var(--r-lg) var(--r-lg)}
.modal footer .left{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}
.viewer{width:100%;height:72vh;border:0;background:#fff;border-radius:6px}
.viewer-img{max-width:100%;max-height:75vh;display:block;margin:0 auto;border-radius:6px}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0}
#toasts{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:16px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:360px}
.toast.bad{background:var(--bad);color:#fff}
/* Kalender */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--panel);border-radius:var(--r);overflow:hidden}
.cal .h{padding:6px 8px;font-size:12px;color:var(--muted);font-weight:600;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg)}
.cal .d{min-height:96px;padding:4px 5px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.cal .d:hover{background:var(--navy-soft)}
.cal .d.out{background:var(--bg);color:var(--muted)}
.cal .d.today .n{background:var(--tab);color:var(--tab-ink);border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center}
.cal .n{font-size:12px;font-weight:600}
.ev{font-size:11.5px;padding:1px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--info-bg);color:var(--info)}
.ev.due{background:var(--warn-bg);color:var(--warn)}
.ev.over{background:var(--bad-bg);color:var(--bad)}
.ev.maint{background:var(--ok-bg);color:var(--ok)}
.ev.own{background:var(--plan-bg);color:var(--plan)}
.yearcal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.yearcal .m{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer}
.yearcal .m:hover{border-color:var(--navy)}
.yearcal .m h4{margin:0 0 6px;font-size:14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--tab)}
#printArea{display:none}
@media print{
  body{background:#fff;color:#000}
  #app,#modals,#toasts{display:none!important}
  #printArea{display:block;font-size:11pt}
  #printArea h1{font-size:18pt;margin:0 0 4pt}
  #printArea h2{font-size:13pt;margin:16pt 0 6pt;border-bottom:1.5pt solid #1f4e79;padding-bottom:2pt;break-after:avoid}
  #printArea table{font-size:9.5pt}
  #printArea th{position:static;color:#333;background:#eef1f4}
  #printArea td,#printArea th{padding:3pt 5pt}
  #printArea .meta{color:#555;font-size:9.5pt}
  #printArea tr{break-inside:avoid}
  #printArea .pb{break-before:page}
  #printArea .sig{display:flex;gap:24pt;margin-top:46pt}
  #printArea .sig div{flex:1;border-top:1px solid #000;padding-top:3pt;font-size:9pt}
  #printArea p{margin:0 0 8pt}
}
@media (max-width:1100px){#uGrid{grid-template-columns:1fr!important}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.g-dash,.hero{grid-template-columns:1fr}.filters{grid-template-columns:repeat(3,minmax(0,1fr))}.filters-more{grid-template-columns:repeat(3,minmax(0,1fr))}.yearcal{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:60;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  #side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
  #burger{display:block}
  #top{padding:10px 14px 0;flex-wrap:wrap;top:env(safe-area-inset-top,0px)}
  #top h1{font-size:17px}
  .top-right{width:100%;justify-content:space-between}
  .top-right .btn.pri .lbl{display:none}
  #main{padding:16px 14px 80px}
  .g2,.g3{grid-template-columns:1fr}
  .form{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form .c2,.form .c3{grid-column:span 1}.form .c4{grid-column:1/-1}
  .filters,.filters-more{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filters .q{grid-column:1/-1}
  .hide-m{display:none}
  .cal .d{min-height:62px}
  .ev{font-size:10px;padding:0 3px}
  .yearcal{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero .big{font-size:32px}
  #modals .ov{padding:0}
  .modal{border-radius:0;min-height:100%}
  .modal footer{border-radius:0}
}
@media (max-width:480px){.kpis{grid-template-columns:1fr 1fr}.kpi b{font-size:18px}.reg button{padding:5px 8px 6px;font-size:13px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand">
      <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="6" fill="#1f4e79"/><path d="M7 15l9-7 9 7v10H7z" fill="#e8b931"/><rect x="13" y="18" width="6" height="7" fill="#1f4e79"/></svg>
      <div><b>WEG Hausverwaltung</b><small id="wegName">Wohnungseigentümergemeinschaft</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <div id="wrap">
    <header id="top">
      <button id="burger" aria-label="Menü öffnen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <h1 id="title">Übersicht</h1>
      <div class="top-right">
        <div class="reg" id="yearReg" aria-label="Jahr wählen"></div>
        <button class="btn pri" data-act="newCost" style="margin-bottom:8px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">Neue Kostenposition</span></button>

<script>

/* =========================================================

/* ---------- Hilfsfunktionen ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const num=v=>{if(v===null||v===undefined||v==='')return 0;if(typeof v==='number')return isFinite(v)?v:0;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n};
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const eur=n=>(+n||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const eur0=n=>(+n||0).toLocaleString('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>iso(new Date());
const fd=s=>s?String(s).slice(0,10).split('-').reverse().join('.'):'–';
const fdt=s=>s?new Date(s).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'}):'–';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parseISO=s=>{const [y,m,d]=String(s).slice(0,10).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const addDays=(s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return iso(d)};
const addMonths=(s,n)=>{const d=parseISO(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d)};
const daysUntil=s=>Math.round((parseISO(s)-parseISO(today()))/864e5);
const sum=(arr,f)=>r2(arr.reduce((a,x)=>a+(+f(x)||0),0));
const MONTHS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const MON=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const fsize=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(0)+' KB':(b/1048576).toFixed(1)+' MB';
const pct=(a,b)=>b?((a-b)/b*100):null;
const fpct=p=>p===null?'–':(p>0?'+':'')+p.toFixed(1).replace('.',',')+' %';

/* ---------- Konstanten ---------- */
const RES_GROUP='Rücklagen und größere Maßnahmen';
const DEFAULT_CATS={
 'Technische Anlagen und Wartung':['Heizungsanlage und Heizungswartung','Aufzug und Aufzugswartung','Enthärtungsanlage und Regeneriersalz','Wasseraufbereitung','Lüftungsanlage','Rauchwarnmelder','Brandschutz und Feuerlöscher','Elektrische Anlagen und Prüfungen','Garagentor und Tiefgarage','Photovoltaikanlage'],
 'Gebäude und Außenanlagen':['Hausmeister','Gebäudereinigung','Gartenpflege','Winterdienst und Streusalz','Dach- und Fassadenarbeiten','Reparaturen am Gemeinschaftseigentum','Beleuchtung und Allgemeinstrom','Wasser und Abwasser','Müllentsorgung','Schädlingsbekämpfung'],
 'Verwaltung und Versicherungen':['Hausverwaltung','Gebäudeversicherung','Haftpflichtversicherung','Bankgebühren','Rechtsberatung','Sonstige Verwaltungskosten'],
 [RES_GROUP]:['Zuführung zur Erhaltungsrücklage','Geplante Sanierungen','Sonderreparaturen','Sonstige größere Investitionen']
};
const STATUS_INPUT=['Geplant','Rechnung eingegangen','Offen','Bezahlt','Storniert'];
const STATUS_ALL=['Geplant','Rechnung eingegangen','Offen','Teilweise bezahlt','Bezahlt','Überfällig','Storniert'];
const STATUS_CLS={'Geplant':'b-plan','Rechnung eingegangen':'b-info','Offen':'b-warn','Teilweise bezahlt':'b-warn','Bezahlt':'b-ok','Überfällig':'b-bad','Storniert':''};
const INTERVALS={monatlich:1,vierteljährlich:3,halbjährlich:6,jährlich:12,individuell:null};
const ALLOWED_EXT=['pdf','jpg','jpeg','png','webp','gif','heic','heif','doc','docx','xls','xlsx','odt','ods','txt','csv','eml','msg'];
const MAX_FILE=25*1024*1024;

/* ---------- IndexedDB ---------- */
const DB_NAME='weg-kostentracker', DB_VER=2;
const STORES=['meta','categories','costs','recurring','events','docs','blobs','providers','reserve','resolutions','receipts','plans','meetings'];
const DATA_STORES=STORES.filter(s=>s!=='blobs');
let db;
function openDB(){return new Promise((res,rej)=>{
  if(!('indexedDB' in window))return rej(new Error('Dieser Browser unterstützt keine dauerhafte Speicherung (IndexedDB).'));
  const r=indexedDB.open(DB_NAME,DB_VER);
  r.onupgradeneeded=()=>{const d=r.result;STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})})};
  r.onsuccess=()=>{db=r.result;res()};
  r.onerror=()=>rej(r.error);
  r.onblocked=()=>rej(new Error('Datenbank ist blockiert – bitte andere Tabs mit der App schließen.'));
})}
const req2p=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const dbAll=s=>req2p(db.transaction(s).objectStore(s).getAll());
const dbGet=(s,id)=>req2p(db.transaction(s).objectStore(s).get(id));
function dbWrite(s,fn){return new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');fn(t.objectStore(s));t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('Speichern abgebrochen (Speicher voll?)'))})}
const dbPut=(s,v)=>dbWrite(s,st=>st.put(v));
const dbDel=(s,id)=>dbWrite(s,st=>st.delete(id));
const dbClear=s=>dbWrite(s,st=>st.clear());

/* ---------- Zustand ---------- */
const S={settings:null,categories:[],costs:[],recurring:[],events:[],docs:[],providers:[],reserve:[],resolutions:[],receipts:[],plans:[],meetings:[],year:new Date().getFullYear(),view:'dashboard'};
async function loadAll(){for(const s of DATA_STORES){if(s==='meta')continue;S[s]=await dbAll(s)}S.settings=(await dbGet('meta','settings'))||null}
async function save(store,obj,{silentStamp}={}){
  const now=new Date().toISOString();
  if(!obj.id)obj.id=uid();
  if(!obj.createdAt)obj.createdAt=now;
  if(!silentStamp)obj.updatedAt=now;
  await dbPut(store,obj);
  const arr=S[store];const i=arr.findIndex(x=>x.id===obj.id);
  if(i>=0)arr[i]=obj;else arr.push(obj);
  return obj;
}
async function removeRec(store,id){await dbDel(store,id);S[store]=S[store].filter(x=>x.id!==id)}
async function saveSettings(){await dbPut('meta',S.settings)}

/* ---------- Fachlogik ---------- */
const cat=id=>S.categories.find(c=>c.id===id);
const catName=id=>cat(id)?.name||'(ohne Kategorie)';
const catGroup=id=>cat(id)?.group||'Sonstiges';
const isReserveCat=id=>catGroup(id)===RES_GROUP;
const paidOf=c=>sum(c.payments||[],p=>num(p.amount));
const isActual=c=>c.status!=='Geplant'&&c.status!=='Storniert';
const restOf=c=>isActual(c)?Math.max(0,r2(num(c.gross)-paidOf(c))):0;
function effStatus(c){
  if(c.status==='Storniert')return 'Storniert';
  if(c.status==='Geplant')return 'Geplant';
  const g=num(c.gross),p=paidOf(c);
  if(g===0&&c.status==='Bezahlt')return 'Bezahlt';
  if(g>0&&p>=g-0.005)return 'Bezahlt';
  if(c.dueDate&&c.dueDate<today())return 'Überfällig';
  if(p>0)return 'Teilweise bezahlt';
  return c.status==='Rechnung eingegangen'?'Rechnung eingegangen':'Offen';
}
const isOverdue=c=>effStatus(c)==='Überfällig';
const lastPayDate=c=>(c.payments||[]).map(p=>p.date).filter(Boolean).sort().pop()||'';
const costsOfYear=y=>S.costs.filter(c=>+c.year===+y);
const monthOf=c=>c.invoiceDate?parseISO(c.invoiceDate).getMonth():(c.maintenanceDate?parseISO(c.maintenanceDate).getMonth():null);
const docsOf=id=>S.docs.filter(d=>d.costId===id);
const recMonths=r=>r.interval==='individuell'?Math.max(1,num(r.customMonths)||12):INTERVALS[r.interval]||12;
const annualOf=r=>r2(num(r.expectedAmount)*12/recMonths(r));
function occurrences(r,from,to){
  const out=[];if(!r.nextDate||r.active===false)return out;
  let d=r.nextDate,guard=0;
  while(d<=to&&guard++<400){if(d>=from)out.push(d);d=addMonths(d,recMonths(r))}
  return out;
}
function yearsAvailable(){
  const set=new Set([new Date().getFullYear(),S.year,...(S.settings?.years||[])]);
  S.costs.forEach(c=>c.year&&set.add(+c.year));
  return [...set].sort((a,b)=>a-b);
}
function plannedForYear(y){
  const geplant=costsOfYear(y).filter(c=>c.status==='Geplant');
  const from=y<new Date().getFullYear()?null:(y===new Date().getFullYear()?today():`${y}-01-01`);
  let proj=[];
  if(from){S.recurring.filter(r=>r.active!==false).forEach(r=>occurrences(r,from,`${y}-12-31`).forEach(d=>proj.push({r,date:d,amount:num(r.expectedAmount)})))}
  return {geplant,proj,sumGeplant:sum(geplant,c=>num(c.gross)),sumProj:sum(proj,p=>p.amount),total:r2(sum(geplant,c=>num(c.gross))+sum(proj,p=>p.amount))};
}
function unusual(c){
  if(!isActual(c)||!num(c.gross))return null;
  const r=c.recurringId&&S.recurring.find(x=>x.id===c.recurringId);
  if(r&&num(r.expectedAmount)>0&&num(c.gross)>num(r.expectedAmount)*1.3)return `über 30 % höher als erwartet (${eur(r.expectedAmount)})`;
  const peers=S.costs.filter(x=>x.id!==c.id&&x.categoryId===c.categoryId&&isActual(x)&&num(x.gross)>0);
  if(peers.length>=3){const avg=sum(peers,x=>num(x.gross))/peers.length;if(num(c.gross)>avg*1.8)return `deutlich über dem Kategorie-Durchschnitt (${eur(avg)})`}
  return null;
}
function prevYearCompare(c){
  const py=+c.year-1;
  if(c.recurringId){const prev=S.costs.filter(x=>x.recurringId===c.recurringId&&+x.year===py&&isActual(x));if(prev.length)return {label:'Gleicher Vertrag/Wartung im Vorjahr',value:sum(prev,x=>num(x.gross)),n:prev.length}}
  const prev=S.costs.filter(x=>x.categoryId===c.categoryId&&+x.year===py&&isActual(x));
  return {label:'Gleiche Kategorie im Vorjahr',value:sum(prev,x=>num(x.gross)),n:prev.length};
}
function reminders(){
  const t=today(),out=[];
  S.recurring.filter(r=>r.active!==false&&r.nextDate).forEach(r=>{
    const rd=addDays(r.nextDate,-(num(r.remindDays)||14));
    if(r.nextDate<t)out.push({kind:'over',date:r.nextDate,title:r.title,text:'Termin überfällig',act:'recDetail',id:r.id});
    else if(rd<=t)out.push({kind:'maint',date:r.nextDate,title:r.title,text:`Termin in ${daysUntil(r.nextDate)} Tagen`,act:'recDetail',id:r.id});
    if(r.contractEnd){const notice=addMonths(r.contractEnd,-(num(r.noticeMonths)||0));if(r.contractEnd>=t&&addDays(notice,-60)<=t)out.push({kind:'due',date:notice,title:r.title,text:`Vertrag endet ${fd(r.contractEnd)} – Kündigungsfrist ${fd(notice)}`,act:'recDetail',id:r.id})}
  });
  S.costs.filter(c=>restOf(c)>0&&c.dueDate&&!c.archived).forEach(c=>{
    if(c.dueDate<t)out.push({kind:'over',date:c.dueDate,title:c.title,text:`Rechnung überfällig – offen ${eur(restOf(c))}`,act:'costDetail',id:c.id});
    else if(daysUntil(c.dueDate)<=7)out.push({kind:'due',date:c.dueDate,title:c.title,text:`Zahlung fällig in ${daysUntil(c.dueDate)} Tagen – ${eur(restOf(c))}`,act:'costDetail',id:c.id});
  });
  S.events.filter(e=>!e.done&&e.date).forEach(e=>{
    if(e.date<t)out.push({kind:'over',date:e.date,title:e.title,text:'Termin überfällig',act:'eventEdit',id:e.id});
    else if(addDays(e.date,-(num(e.remindDays)||7))<=t)out.push({kind:'own',date:e.date,title:e.title,text:`Termin in ${daysUntil(e.date)} Tagen`,act:'eventEdit',id:e.id});
  });
  return out.sort((a,b)=>a.date<b.date?-1:1);
}

/* ---------- Diagramme (SVG, ohne externe Bibliothek) ---------- */
function barChart(labels,series,{h=220}={}){
  const W=Math.max(380,Math.min(720,labels.length*60)),H=h,pl=56,pr=8,pt=12,pb=26;const max=Math.max(1,...series.flatMap(s=>s.values));
  const step=niceStep(max);const top=Math.ceil(max/step)*step;
  const cw=(W-pl-pr)/labels.length,bw=Math.min(22,(cw-8)/series.length);
  let g='';for(let v=0;v<=top;v+=step){const y=pt+(H-pt-pb)*(1-v/top);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${v>=1000?(v/1000).toLocaleString('de-DE')+' T':v}</text>`}
  labels.forEach((l,i)=>{const x0=pl+i*cw+(cw-bw*series.length)/2;
    series.forEach((s,j)=>{const v=s.values[i]||0;const bh=(H-pt-pb)*v/top;g+=`<rect x="${x0+j*bw}" y="${H-pb-bh}" width="${bw-2}" height="${Math.max(0,bh)}" rx="2" fill="${s.color}"><title>${esc(s.name)} ${esc(l)}: ${eur(v)}</title></rect>`});
    g+=`<text x="${pl+i*cw+cw/2}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`});
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Balkendiagramm">${g}</svg></div><div class="legend" style="margin-top:6px">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;
}
function niceStep(max){const raw=max/4;const p=Math.pow(10,Math.floor(Math.log10(raw)));const n=raw/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
function hbars(rows,{max}={}){
  if(!rows.length)return '<div class="empty small">Noch keine Daten für diesen Zeitraum.</div>';
  const m=max||Math.max(...rows.map(r=>r.value),1);
  return `<div class="hbar">${rows.map(r=>`<div>${esc(r.label)}${r.extra||''}</div><div class="num" style="text-align:right">${eur(r.value)}</div><div class="bar"><i style="width:${Math.max(1,r.value/m*100)}%;${r.color?`background:${r.color}`:''}"></i></div>`).join('')}</div>`;
}

/* ---------- OCR (Texterkennung) ---------- */
function loadScript(src){return new Promise((res,rej)=>{if($(`script[src="${src}"]`))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Texterkennung konnte nicht geladen werden. Für OCR wird eine Internetverbindung benötigt.'));document.head.appendChild(s)})}

  const w=await Tesseract.createWorker('deu',1,{logger:m=>{if(m.status==='recognizing text'&&onP)onP(Math.round(m.progress*100))}});

async function ocrFile(file,onP){

    if(!window.pdfjsLib){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}

    for(let i=1;i<=Math.min(pdf.numPages,4);i++){const p=await pdf.getPage(i);const tc=await p.getTextContent();let lastY=null,line='';
      for(const it of tc.items){const y=Math.round(it.transform[5]);if(lastY!==null&&Math.abs(y-lastY)>3){text+=line+'\n';line=''}line+=(line&&it.str?' ':'')+it.str;lastY=y}text+=line+'\n'}

    onP&&onP(1);const page=await pdf.getPage(1),vp=page.getViewport({scale:2.2}),cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;

const parseDE=s=>{const n=parseFloat(String(s).replace(/\s/g,'').replace(/\./g,'').replace(',','.'));return isNaN(n)?'':n};
function toISOm(m){let y=+m[3];if(y<100)y+=2000;const d=new Date(y,+m[2]-1,+m[1]);return isNaN(d)||+m[2]>12||+m[1]>31?'':iso(d)}

  const near=re=>{for(const l of lines)if(re.test(l)){const m=l.match(dRe);if(m)return toISOm(m)}return ''};
  r.invoiceDate=near(/rechnungsdatum/i)||near(/datum/i)||(()=>{const m=t.match(dRe);return m?toISOm(m):''})();
  r.dueDate=near(/fällig|zahlbar|zahlungsziel|zahlung bis|bis zum/i);
  if(!r.dueDate&&r.invoiceDate){const m=t.match(/(?:innerhalb|binnen)\s+(?:von\s+)?(\d{1,3})\s+Tag/i);if(m)r.dueDate=addDays(r.invoiceDate,+m[1])}
  let gross='';for(const l of lines)if(/gesamt|rechnungsbetrag|endbetrag|zu zahlen|brutto|summe/i.test(l)&&!/netto|zwischensumme/i.test(l)){const a=l.match(aRe);if(a)gross=parseDE(a[a.length-1])}
  if(gross===''){const all=(t.match(aRe)||[]).map(parseDE).filter(x=>x!=='');if(all.length)gross=Math.max(...all)}
  r.gross=gross;
  for(const l of lines)if(/netto/i.test(l)){const a=l.match(aRe);if(a){r.net=parseDE(a[a.length-1]);break}}
  const v=t.match(/(19|7|0)\s?%\s*(?:MwSt|USt|Mehrwertsteuer|Umsatzsteuer)/i)||t.match(/(?:MwSt|USt|Mehrwertsteuer|Umsatzsteuer)[^\d\n]{0,12}(19|7)\s?%/i);if(v)r.vatRate=+v[1];
  return r;
}

  ov.querySelector('[data-cancel]').onclick=async()=>{if(pending.length&&!await confirmBox('Ungespeicherte Dateien gehen verloren. Formular schließen?',{ok:'Schließen'}))return;closeModal(ov)};

    if(c.status==='Bezahlt'){const rest=r2(c.gross-sum(c.payments,x=>num(x.amount)));if(rest>0)c.payments.push({id:uid(),date:v('paymentDate'),amount:rest,note:'Zahlung (Status „Bezahlt“)'})}
    // Dubletten
    const dup=S.costs.find(x=>x.id!==c.id&&((c.invoiceNo&&x.invoiceNo&&x.invoiceNo.toLowerCase()===c.invoiceNo.toLowerCase()&&(x.provider||'').toLowerCase()===(c.provider||'').toLowerCase())||(c.invoiceDate&&x.invoiceDate===c.invoiceDate&&num(x.gross)===c.gross&&c.gross>0&&(x.provider||'')===(c.provider||''))));
    if(dup&&!await confirmBox(`Möglicherweise doppelt: „${esc(dup.title)}“ vom ${fd(dup.invoiceDate)} über ${eur(dup.gross)} (${esc(dup.provider||'')}) existiert bereits. Trotzdem speichern?`,{ok:'Trotzdem speichern'}))return;
    const btn=ov.querySelector('[data-save]');btn.disabled=true;btn.textContent='Speichert …';
    try{
      await save('costs',c);
      if(c.provider&&!S.providers.find(p=>p.name.toLowerCase()===c.provider.toLowerCase()))await save('providers',{name:c.provider,contact:'',phone:'',email:'',notes:''});
      for(const p of pending)await storeDoc(c.id,p.file,{name:p.name,ocrText:p.ocrText});
      closeModal(ov);toast(ex?'Änderungen gespeichert':`Kostenposition gespeichert${pending.length?` mit ${pending.length} Beleg${pending.length>1?'en':''}`:''}`);
      if(!S.settings.years.includes(c.year)){S.settings.years.push(c.year);await saveSettings()}
      render();
      const r=c.recurringId&&S.recurring.find(x=>x.id===c.recurringId);
      if(r&&isActual(c)&&(!ex||ex.maintenanceDate!==c.maintenanceDate||ex.gross!==c.gross))offerNextDate(r,c);
    }catch(e){btn.disabled=false;btn.textContent='Speichern';toast('Speichern fehlgeschlagen: '+e.message,true)}
  };
}
function offerNextDate(r,c){
  const base=c.maintenanceDate||c.invoiceDate||today();const next=addMonths(base,recMonths(r));
  const ov=openModal('Nächsten Termin planen?',`<p style="margin-top:0">Die Kostenposition ist „${esc(r.title)}“ zugeordnet. Soll der Vertrag aktualisiert werden?</p>
   <div class="form"><label class="f c3">Letzter Termin<input type="date" id="nLast" value="${esc(base)}"></label><label class="f c3">Letzter Betrag<input type="number" step="0.01" id="nAmt" value="${esc(c.gross)}"></label>
   <label class="f c3">Nächster Termin (${esc(r.interval)})<input type="date" id="nNext" value="${esc(next)}"></label><label class="f c3">Erwarteter Betrag künftig<input type="number" step="0.01" id="nExp" value="${esc(r.expectedAmount)}"></label></div>
   <p class="hint">Es wird nur der Termin geplant – es entsteht keine Rechnung und keine Ausgabe.</p>`,{footer:`<button class="btn" data-no>Nicht jetzt</button><button class="btn pri" data-yes>Termin planen</button>`});
  ov.querySelector('[data-no]').onclick=()=>closeModal(ov);
  ov.querySelector('[data-yes]').onclick=async()=>{await applyRecDone(r,$('#nLast',ov).value,num($('#nAmt',ov).value),$('#nNext',ov).value,num($('#nExp',ov).value));closeModal(ov);toast('Nächster Termin geplant');render()};
}
async function applyRecDone(r,lastDate,lastAmount,nextDate,expected){
  r.priceHistory=r.priceHistory||[];
  if(lastAmount>0&&num(r.lastAmount)!==lastAmount)r.priceHistory.push({date:lastDate||today(),amount:lastAmount,note:'tatsächlicher Betrag'});
  if(expected>0&&num(r.expectedAmount)!==expected)r.priceHistory.push({date:today(),amount:expected,note:'neuer erwarteter Betrag'});
  Object.assign(r,{lastDate,lastAmount:lastAmount||r.lastAmount,nextDate,expectedAmount:expected||r.expectedAmount});
  await save('recurring',r);
}

  const body=`<div class="spread" style="margin-bottom:10px"><div>${badge(st)}${demoB(c)} ${c.archived?'<span class="badge">archiviert</span>':''} ${c.fromReserve?'<span class="badge b-plan">aus Rücklage</span>':''}</div><div class="num" style="font-size:22px;font-weight:700">${eur(c.gross)}</div></div>

/* ---------- Ansicht: Kalender ---------- */
const CAL={y:new Date().getFullYear(),m:new Date().getMonth(),mode:'month'};
function calItems(from,to){
  const it=[],t=today();
  S.costs.forEach(c=>{
    if(c.dueDate&&c.dueDate>=from&&c.dueDate<=to&&restOf(c)>0)it.push({date:c.dueDate,cls:c.dueDate<t?'over':'due',label:`Fällig: ${c.title}`,act:'costDetail',id:c.id});
    if(c.maintenanceDate&&c.maintenanceDate>=from&&c.maintenanceDate<=to)it.push({date:c.maintenanceDate,cls:c.status==='Geplant'?'own':'maint',label:`${c.status==='Geplant'?'Geplant':'Wartung'}: ${c.title}`,act:'costDetail',id:c.id});
  });
  S.recurring.forEach(r=>{occurrences(r,from,to).forEach((d,i)=>it.push({date:d,cls:d<t?'over':'maint',label:`${r.title}${i?' (Prognose)':''}`,act:'recDetail',id:r.id}));
    if(r.contractEnd&&r.contractEnd>=from&&r.contractEnd<=to)it.push({date:r.contractEnd,cls:'due',label:`Vertragsende: ${r.title}`,act:'recDetail',id:r.id})});
  S.events.forEach(e=>{if(e.date>=from&&e.date<=to)it.push({date:e.date,cls:e.done?'':(e.date<t?'over':'own'),label:`${e.time?e.time+' ':''}${e.title}${e.done?' ✓':''}`,act:'eventEdit',id:e.id})});
  return it.sort((a,b)=>a.date<b.date?-1:1);
}
function vCalendar(){
  const {y,m,mode}=CAL;
  const head=`<div class="spread mb-top"><div class="row"><button class="btn sm" data-act="calNav" data-id="-1" aria-label="zurück">‹</button><b style="min-width:150px;text-align:center">${mode==='month'?`${MONTHS[m]} ${y}`:y}</b><button class="btn sm" data-act="calNav" data-id="1" aria-label="vor">›</button><button class="btn sm ghost" data-act="calToday">Heute</button></div>
   <div class="row"><div class="tabs" style="margin:0;border:0"><button class="${mode==='month'?'on':''}" data-act="calMode" data-id="month">Monat</button><button class="${mode==='year'?'on':''}" data-act="calMode" data-id="year">Jahr</button></div><button class="btn pri sm" data-act="eventEdit">Termin eintragen</button></div></div>
   <div class="legend mb-top"><span><i style="background:var(--ok)"></i>Wartung</span><span><i style="background:var(--warn)"></i>Fälligkeit / Vertrag</span><span><i style="background:var(--bad)"></i>überfällig</span><span><i style="background:var(--plan)"></i>eigener Termin / geplant</span></div>`;
  if(mode==='year'){
    const items=calItems(`${y}-01-01`,`${y}-12-31`);
    $('#main').innerHTML=head+`<div class="yearcal">${MONTHS.map((mn,i)=>{const mi=items.filter(x=>parseISO(x.date).getMonth()===i);return `<div class="m" data-act="calOpenMonth" data-id="${i}"><h4>${mn}</h4>${mi.slice(0,5).map(x=>`<div class="ev ${x.cls}" title="${esc(x.label)}">${parseISO(x.date).getDate()}. ${esc(x.label)}</div>`).join('')}${mi.length>5?`<div class="small muted">+ ${mi.length-5} weitere</div>`:''}${!mi.length?'<div class="small muted">keine Termine</div>':''}</div>`}).join('')}</div>`;
    return;
  }
  const first=new Date(y,m,1),start=new Date(y,m,1-((first.getDay()+6)%7));
  const days=Array.from({length:42},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d});
  const items=calItems(iso(days[0]),iso(days[41])),t=today();

function yearStats(y){

  return {all,act,invoiced:sum(act,c=>num(c.gross)),paid:sum(act,paidOf),open:sum(act,restOf),planned:plan.total,plan,cancelled:sum(all.filter(c=>c.status==='Storniert'),c=>num(c.gross))};
}
function groupSum(list,keyFn){const m={};list.forEach(c=>{const k=keyFn(c);m[k]=(m[k]||0)+num(c.gross)});return m}

  const maintCats=S.categories.filter(c=>/wartung|prüfung|reparatur|aufzug|heizung|brandschutz|lüftung|sonderrep/i.test(c.name)).map(c=>c.id);

   <div class="kpi" style="--c:${C1}"><span>Rechnungsbeträge</span><b>${eur(s.invoiced)}</b><em>${s.act.length} Rechnungen, Vorjahr ${eur(p.invoiced)} (${fpct(pct(s.invoiced,p.invoiced))})</em></div>
   <div class="kpi" style="--c:var(--ok)"><span>Tatsächlich gezahlt</span><b>${eur(s.paid)}</b><em>auf Rechnungen des Jahres ${Y}</em></div>
   <div class="kpi" style="--c:${C3}"><span>Offene Verbindlichkeiten</span><b>${eur(s.open)}</b><em>${s.cancelled?`storniert: ${eur(s.cancelled)}`:'aus Rechnungen des Jahres'}</em></div>
  </div>
  <div class="grid g2">
   <div class="panel"><h2>Monatsübersicht ${Y}</h2><div style="overflow-x:auto"><table><thead><tr><th>Monat</th><th class="num">Rechnungen</th><th class="num">Rechnungsbetrag</th><th class="num">Zahlungen</th></tr></thead><tbody>${months.map(x=>`<tr><td>${x.mn}</td><td class="num">${x.n||''}</td><td class="num">${x.inv?eur(x.inv):'–'}</td><td class="num">${x.paid?eur(x.paid):'–'}</td></tr>`).join('')}</tbody><tfoot><tr><td>Summe</td><td class="num">${s.act.length}</td><td class="num">${eur(sum(months,x=>x.inv))}</td><td class="num">${eur(sum(months,x=>x.paid))}</td></tr></tfoot></table></div><p class="hint">Zahlungen nach Zahlungsdatum im Jahr ${Y}, auch für Rechnungen anderer Jahre.</p></div>
   <div class="panel"><h2>Vergleich der Jahre</h2>${barChart(ys.map(String),[{name:'Rechnungsbeträge',values:ys.map(y=>yearStats(y).invoiced),color:C1},{name:'Gezahlt',values:ys.map(y=>yearStats(y).paid),color:'#2f8f5b'},{name:'Geplant/Prognose',values:ys.map(y=>yearStats(y).planned),color:C2}],{h:240})}
    <h3>Nach Bereichen</h3>${hbars(Object.entries(groups).map(([g,v])=>({label:g,value:r2(v),color:g===RES_GROUP?C4:C1})).sort((a,b)=>b.value-a.value))}</div>
  </div>
  <div class="panel" style="margin-top:16px"><h2>Kosten je Kategorie – Plan, Ist und Vorjahr</h2><div style="overflow-x:auto"><table><thead><tr><th>Kategorie</th><th class="num">Geplant/Prognose ${Y}</th><th class="num">Ist ${Y}</th><th class="num">Ist ${PY}</th><th class="num">Veränderung</th></tr></thead><tbody>${cats.map(id=>`<tr><td>${esc(catName(id))}<div class="t-sub">${esc(catGroup(id))}</div></td><td class="num">${planByCat[id]?eur(planByCat[id]):'–'}</td><td class="num">${byCat[id]?eur(byCat[id]):'–'}</td><td class="num">${pbyCat[id]?eur(pbyCat[id]):'–'}</td><td class="num">${byCat[id]&&pbyCat[id]?fpct(pct(byCat[id],pbyCat[id])):'–'}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Keine Daten</td></tr>'}</tbody><tfoot><tr><td>Summe</td><td class="num">${eur(s.planned)}</td><td class="num">${eur(s.invoiced)}</td><td class="num">${eur(p.invoiced)}</td><td class="num">${fpct(pct(s.invoiced,p.invoiced))}</td></tr></tfoot></table></div></div>

  </div>
  <div class="grid g2" style="margin-top:16px">
   <div class="panel"><h2>Geplante zukünftige Ausgaben</h2>${(()=>{const g=S.costs.filter(c=>c.status==='Geplant').sort((a,b)=>a.year-b.year);return g.length?`<table><tbody>${g.map(c=>`<tr class="click" data-act="costDetail" data-id="${c.id}"><td>${c.year}</td><td>${esc(c.title)}${demoB(c)}</td><td class="num">${eur(c.gross)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty small">Keine geplanten Einzelmaßnahmen.</div>'})()}<p class="hint">Prognose aus Wartungsverträgen ${Y}: ${eur(s.plan.sumProj)} (${s.plan.proj.length} Termine).</p></div>
   <div class="panel"><h2>Offene Verbindlichkeiten</h2>${(()=>{const o=S.costs.filter(c=>restOf(c)>0);return o.length?`<table><tbody>${o.map(c=>`<tr class="click" data-act="costDetail" data-id="${c.id}"><td>${fd(c.dueDate)}</td><td>${esc(c.title)}</td><td class="num">${eur(restOf(c))}</td><td>${badge(effStatus(c))}</td></tr>`).join('')}</tbody></table>`:'<div class="empty small">Keine offenen Rechnungen.</div>'})()}</div>
  </div>`;
}

   {footer:`${!isNew?'<div class="left"><button class="btn danger" data-del>Löschen</button></div>':''}<button class="btn" data-no>Abbrechen</button><button class="btn pri" data-yes>Speichern</button>`});

/* ---------- Ansicht: Rücklage & Beschlüsse ---------- */
function reserveBalance(upTo){
  const tx=sum(S.reserve.filter(x=>!upTo||x.date<=upTo),x=>(x.type==='Entnahme'?-1:1)*num(x.amount));
  const used=sum(S.costs.filter(c=>c.fromReserve),c=>sum((c.payments||[]).filter(p=>!upTo||p.date<=upTo),p=>num(p.amount)));
  return {tx,used,bal:r2(tx-used)};
}
function vReserve(){
  const b=reserveBalance(),planned=sum(S.costs.filter(c=>c.fromReserve&&c.status==='Geplant'),c=>num(c.gross)),openR=sum(S.costs.filter(c=>c.fromReserve),restOf);
  const ledger=[...S.reserve.map(x=>({date:x.date,label:`${x.type}${x.note?': '+x.note:''}`,amount:(x.type==='Entnahme'?-1:1)*num(x.amount),id:x.id,demo:x.isDemo,kind:'tx'})),...S.costs.filter(c=>c.fromReserve).flatMap(c=>(c.payments||[]).map(p=>({date:p.date,label:`Zahlung aus Rücklage: ${c.title}`,amount:-num(p.amount),id:c.id,demo:c.isDemo,kind:'cost'})))].sort((a,b)=>a.date<b.date?-1:1);

  $('#main').innerHTML=`<p class="small muted" style="margin-top:0;max-width:75ch">Die Erhaltungsrücklage wird getrennt von den laufenden Betriebskosten geführt. Zuführungen und Entnahmen trägst du hier ein. Kostenpositionen mit dem Haken „aus der Erhaltungsrücklage finanziert“ mindern den Bestand, sobald sie bezahlt sind.</p>
  <div class="kpis"><div class="kpi" style="--c:${C4}"><span>Aktueller Bestand</span><b>${eur(b.bal)}</b><em>Zuführungen ${eur(b.tx)}, verwendet ${eur(b.used)}</em></div>
   <div class="kpi" style="--c:${C3}"><span>Offene Rechnungen aus Rücklage</span><b>${eur(openR)}</b><em>&nbsp;</em></div>
   <div class="kpi" style="--c:${C2}"><span>Geplante Maßnahmen aus Rücklage</span><b>${eur(planned)}</b><em>&nbsp;</em></div>
   <div class="kpi" style="--c:${b.bal-openR-planned<0?'var(--bad)':'var(--ok)'}"><span>Bestand nach allen Planungen</span><b>${eur(r2(b.bal-openR-planned))}</b><em>&nbsp;</em></div></div>
  <div class="grid g2"><div class="panel"><div class="spread"><h2>Rücklagenkonto</h2><button class="btn sm pri" data-act="resTx">Buchung eintragen</button></div>

function costRows(list){return list.map(c=>({Jahr:c.year,Rechnungsdatum:fd(c.invoiceDate),Bezeichnung:c.title,Kategorie:catName(c.categoryId),Bereich:catGroup(c.categoryId),Dienstleister:c.provider||'',Rechnungsnummer:c.invoiceNo||'',Leistung_von:fd(c.periodFrom),Leistung_bis:fd(c.periodTo),Faellig:fd(c.dueDate),Netto:num(c.net),MwSt_Satz:num(c.vatRate),MwSt:num(c.vat),Brutto:num(c.gross),Bezahlt:paidOf(c),Offen:restOf(c),Letzte_Zahlung:fd(lastPayDate(c)),Status:effStatus(c),Kostenart:c.type,Wartungstermin:fd(c.maintenanceDate),Aus_Ruecklage:c.fromReserve?'ja':'nein',Belege:docsOf(c.id).map(d=>d.fileName).join(', '),Beispieldaten:c.isDemo?'ja':'nein',Beschreibung:c.description||''}))}
function toCSV(rows){if(!rows.length)return '';const h=Object.keys(rows[0]);const cell=v=>typeof v==='number'?csvNum(v):`"${String(v??'').replace(/"/g,'""')}"`;return '\ufeff'+[h.join(';'),...rows.map(r=>h.map(k=>cell(r[k])).join(';'))].join('\r\n')}
function toXLS(sheets){
  const x=s=>String(s??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

/* ---------- Datensicherung ---------- */
async function blobToDataURL(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)})}
function dataURLToBlob(u){const [h,d]=u.split(',');const mime=(h.match(/data:([^;]+)/)||[])[1]||'application/octet-stream';const bin=atob(d);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:mime})}
async function backup(){
  toast('Sicherung wird erstellt …');
  const data={};for(const s of DATA_STORES)data[s]=await dbAll(s);
  const blobs=[];for(const b of await dbAll('blobs'))blobs.push({id:b.id,dataUrl:await blobToDataURL(b.blob)});
  const out=JSON.stringify({app:'weg-kostentracker',version:1,exportedAt:new Date().toISOString(),data,blobs});
  download(`WEG-Kostentracker-Sicherung-${today()}.json`,out,'application/json');
  S.settings.lastBackup=new Date().toISOString();await saveSettings();render();toast(`Sicherung erstellt (${fsize(out.length)}, ${blobs.length} Belege)`);
}
async function restore(file){
  let j;try{j=JSON.parse(await file.text())}catch(e){return toast('Die Datei ist keine gültige Sicherung.',true)}
  if(j.app!=='weg-kostentracker'||!j.data)return toast('Die Datei ist keine Sicherung des WEG Kostentrackers.',true);
  if(!await confirmBox(`Sicherung vom ${fdt(j.exportedAt)} wiederherstellen? <b>Alle aktuellen Daten in diesem Browser werden ersetzt.</b> Tipp: Vorher eine aktuelle Sicherung erstellen.`,{ok:'Wiederherstellen',danger:true}))return;
  try{for(const s of STORES)await dbClear(s);
    for(const s of DATA_STORES)for(const v of (j.data[s]||[]))await dbPut(s,v);
    for(const b of (j.blobs||[]))await dbPut('blobs',{id:b.id,blob:dataURLToBlob(b.dataUrl)});
    await loadAll();toast('Daten wiederhergestellt');render()}catch(e){toast('Wiederherstellung fehlgeschlagen: '+e.message,true)}
}
async function vData(){
  let est='';try{if(navigator.storage?.estimate){const e=await navigator.storage.estimate();est=`Belegt: ${fsize(e.usage||0)} von verfügbar ca. ${fsize(e.quota||0)}.`}}catch(e){}
  let persisted=null;try{persisted=await navigator.storage?.persisted?.()}catch(e){}

/* ---------- Wohneinheiten & Kostenverteilung nach Tausendstel ---------- */
const KEY_LABEL={mea:'Miteigentumsanteile (‰)',einheit:'Gleich je Einheit',individuell:'Eigene Tausendstel',keine:'Nicht verteilen'};
function defaultUnits(){return [1,2,3,4].map(i=>({id:uid(),name:`Wohnung ${i}`,owner:'',location:'',area:'',mea:250}))}
const units=()=>S.settings.units||(S.settings.units=defaultUnits());
const meaTotal=()=>r2(sum(units(),u=>num(u.mea)));
const fmtPm=v=>(+v||0).toLocaleString('de-DE',{maximumFractionDigits:3})+' ‰';
function catKey(id){return (S.settings.catKeys||{})[id]||'mea'}
function weightsFor(id){
  const k=catKey(id),us=units();
  if(k==='einheit')return us.map(()=>1);
  if(k==='keine')return us.map(()=>0);
  if(k==='individuell'){const m=(S.settings.catCustom||{})[id]||{};return us.map(u=>num(m[u.id]))}
  return us.map(u=>num(u.mea));
}
/* Verteilt auf den Cent genau: die Summe der Anteile ergibt immer exakt den Gesamtbetrag */
function splitCents(amount,weights){
  const tot=weights.reduce((a,b)=>a+b,0),cents=Math.round(amount*100);
  if(!tot||!cents)return weights.map(()=>0);
  const raw=weights.map(w=>cents*w/tot),fl=raw.map(Math.floor);let rest=cents-fl.reduce((a,b)=>a+b,0);
  raw.map((r,i)=>[r-fl[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{if(rest>0){fl[i]++;rest--}});
  return fl.map(c=>c/100);
}
function unitLabel(u){return u.name+(u.owner?` (${u.owner})`:'')}
function unitShareHtml(c){
  const us=units(),w=weightsFor(c.categoryId);
  if(!us.length||!num(c.gross)||c.status==='Storniert')return '';
  const k=catKey(c.categoryId);
  if(!w.some(x=>x>0))return `<h3>Anteile je Wohneinheit</h3><p class="small muted" style="margin:0">Diese Kategorie wird nicht auf die Einheiten verteilt.</p>`;
  const sh=splitCents(num(c.gross),w),wt=w.reduce((a,b)=>a+b,0);
  return `<h3>Anteile je Wohneinheit</h3><p class="small muted" style="margin:0 0 6px">Schlüssel: ${esc(KEY_LABEL[k])}${c.fromReserve?' – wird aus der Erhaltungsrücklage bezahlt':''}${c.status==='Geplant'?' – geplanter Betrag':''}</p>
   <table><tbody>${us.map((u,i)=>`<tr><td>${esc(unitLabel(u))}</td><td class="num small muted">${k==='einheit'?`1/${us.length}`:fmtPm(w[i]/wt*1000)}</td><td class="num">${eur(sh[i])}</td></tr>`).join('')}</tbody></table>`;
}
const D={basis:'ist',noReserve:true};
function distData(y){
  let list;
  if(D.basis==='plan'){const p=plannedForYear(y);list=[...p.geplant.map(c=>({catId:c.categoryId,amount:num(c.gross),fromReserve:c.fromReserve})),...p.proj.map(x=>({catId:x.r.categoryId,amount:x.amount,fromReserve:false}))]}
  else list=costsOfYear(y).filter(isActual).map(c=>({catId:c.categoryId,amount:D.basis==='gezahlt'?paidOf(c):num(c.gross),fromReserve:c.fromReserve}));
  const reserveSum=sum(list.filter(x=>x.fromReserve),x=>x.amount);
  if(D.noReserve)list=list.filter(x=>!x.fromReserve);
  const by={};list.forEach(x=>by[x.catId]=r2((by[x.catId]||0)+x.amount));
  const us=units();
  const rows=Object.entries(by).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).map(([catId,amount])=>{const w=weightsFor(catId),ok=w.some(x=>x>0);return {catId,amount,key:catKey(catId),shares:ok?splitCents(amount,w):us.map(()=>0),undist:!ok}});
  return {rows,us,totals:us.map((_,i)=>r2(sum(rows,r=>r.shares[i]))),total:sum(rows,r=>r.amount),undist:sum(rows.filter(r=>r.undist),r=>r.amount),reserveSum};
}

/* ---------- Wirtschaftsplan-Berechnung ---------- */
function planCalc(p){
  const us=units();
  const lines=Object.entries(p.lines||{}).filter(([id,a])=>num(a)>0&&cat(id)).map(([catId,a])=>{const w=weightsFor(catId),ok=w.some(x=>x>0);return {catId,amount:r2(num(a)),shares:ok?splitCents(num(a),w):us.map(()=>0),undist:!ok}}).sort((a,b)=>(cat(a.catId)?.order??0)-(cat(b.catId)?.order??0));
  const zuf={amount:r2(num(p.zufuehrung)),shares:splitCents(num(p.zufuehrung),us.map(u=>num(u.mea)))};
  const annual=us.map((_,i)=>r2(sum(lines,l=>l.shares[i])+zuf.shares[i]));
  const calcMonthly=annual.map(a=>Math.ceil(a/12*100)/100);
  const monthly=us.map((u,i)=>{const o=(p.override||{})[u.id];return o!==undefined&&o!==''&&o!==null?r2(num(o)):calcMonthly[i]});
  return {us,lines,zuf,annual,calcMonthly,monthly,total:r2(sum(lines,l=>l.amount)+zuf.amount)};
}
function monthlyFor(p,unitId){const pc=planCalc(p),i=pc.us.findIndex(u=>u.id===unitId);return i<0?0:pc.monthly[i]}
function sollMonth(unitId,y,m){const p=planOf(y);if(p&&m>=(num(p.fromMonth)||1)-1)return monthlyFor(p,unitId);const pp=planOf(y-1);return pp?monthlyFor(pp,unitId):0}
function monthsDue(y){const cy=new Date().getFullYear();if(y<cy)return 12;if(y>cy)return 0;const t=today();let n=0;for(let m=0;m<12;m++)if(iso(new Date(y,m,dueDay()))<=t)n++;return n}
function hgStatus(unitId,y){
  const soll=Array.from({length:12},(_,m)=>sollMonth(unitId,y,m));
  const ist=sum(S.receipts.filter(r=>r.unitId===unitId&&+r.forYear===+y&&r.type==='Hausgeld'),r=>num(r.amount));
  const due=monthsDue(y),sollDue=r2(sum(soll.slice(0,due),x=>x));
  let acc=ist;const cells=soll.map((s,m)=>{const paid=Math.min(s,Math.max(0,acc));acc=r2(acc-s);return {soll:s,paid:r2(paid),due:m<due}});
  return {soll,sollYear:r2(sum(soll,x=>x)),sollDue,ist,saldo:r2(ist-sollDue),cells};
}
function hgNotice(){
  const Y=new Date().getFullYear();if(!S.plans.length)return '';
  const back=units().map(u=>({u,s:hgStatus(u.id,Y)})).filter(x=>x.s.saldo<-0.005);
  if(!back.length)return '';
  return `<div class="notice bad"><div class="grow"><b>Hausgeldrückstand ${Y}:</b> ${back.map(x=>`${esc(unitLabel(x.u))} ${eur(-x.s.saldo)}`).join(', ')}</div><a class="btn sm" href="#hausgeld">Hausgeld ansehen</a></div>`;
}

async function planCreate(mode){
  const Y=S.year,PY=Y-1,f=1+num($('#pPct')?.value)/100,zc=zufCatId(),lines={};let zuf=0;

    zuf=planOf(PY)?num(planOf(PY).zufuehrung):sum(S.reserve.filter(x=>x.type==='Zuführung'&&x.date.startsWith(PY)),x=>num(x.amount))}
  if(mode==='plan'){const pp=planOf(PY);Object.entries(pp.lines||{}).forEach(([id,v])=>{if(num(v)>0)lines[id]=Math.ceil(num(v)*f/10)*10});zuf=num(pp.zufuehrung)}

/* ---------- Jahresabrechnung & Vermögensbericht ---------- */
function jaCalc(Y){
  const us=units(),from=`${Y}-01-01`,to=`${Y}-12-31`,zc=zufCatId();
  const pays=[];S.costs.forEach(c=>{if(c.status==='Storniert')return;(c.payments||[]).forEach(p=>{if(p.date>=from&&p.date<=to)pays.push({c,amount:num(p.amount)})})});
  const op=pays.filter(x=>!x.c.fromReserve&&x.c.categoryId!==zc),resPays=pays.filter(x=>x.c.fromReserve);
  const by={};op.forEach(x=>by[x.c.categoryId]=r2((by[x.c.categoryId]||0)+x.amount));
  const lines=Object.entries(by).map(([catId,amount])=>{const w=weightsFor(catId),ok=w.some(v=>v>0);return {catId,amount,shares:ok?splitCents(amount,w):us.map(()=>0),undist:!ok,uml:catUml(cat(catId)),p35:catP35(cat(catId))}}).sort((a,b)=>(cat(a.catId)?.order??0)-(cat(b.catId)?.order??0));
  const p=planOf(Y),pc=p?planCalc(p):null,zufShares=pc?pc.zuf.shares:us.map(()=>0);
  const labor={dienst:{},handwerk:{}},missing=[];
  op.forEach(x=>{const t=catP35(cat(x.c.categoryId));if(!t)return;const g=num(x.c.gross)||x.amount;const l=num(x.c.labor)>0?r2(num(x.c.labor)*x.amount/g):0;if(!l&&!missing.includes(x.c))missing.push(x.c);labor[t][x.c.categoryId]=r2((labor[t][x.c.categoryId]||0)+l)});
  const laborShares=t=>{const res=us.map(()=>0);Object.entries(labor[t]).forEach(([id,a])=>{const w=weightsFor(id);if(w.some(v=>v>0))splitCents(a,w).forEach((s,i)=>res[i]=r2(res[i]+s))});return res};
  const ld=laborShares('dienst'),lh=laborShares('handwerk');
  const rows=us.map((u,i)=>{const costs=r2(sum(lines,l=>l.shares[i])),zuf=zufShares[i]||0,total=r2(costs+zuf),st=hgStatus(u.id,Y),soll=st.sollYear,ist=st.ist;
    return {u,costs,zuf,total,soll,spitze:r2(total-soll),ist,rueck:r2(soll-ist),ergebnis:r2(total-ist),uml:r2(sum(lines.filter(l=>l.uml),l=>l.shares[i])),ld:ld[i],lh:lh[i]}});
  const recYear=S.receipts.filter(r=>r.date>=from&&r.date<=to);
  const resTx=S.reserve.filter(x=>x.date>=from&&x.date<=to);
  const opTotal=r2(sum(op,x=>x.amount)),recTotal=r2(sum(recYear,r=>num(r.amount))),transfers=r2(sum(resTx.filter(x=>x.type==='Zuführung'),x=>num(x.amount)));
  const bankStart=r2(num((S.settings.bankStart||{})[Y]));
  const unpaid=S.costs.filter(c=>+c.year===Y&&isActual(c)&&restOf(c)>0&&!c.fromReserve);
  return {Y,us,lines,rows,opTotal,undist:r2(sum(lines.filter(l=>l.undist),l=>l.amount)),zufTotal:pc?pc.zuf.amount:0,hasPlan:!!p,missing,
    bank:{start:bankStart,rec:recTotal,op:opTotal,transfers,end:r2(bankStart+recTotal-opTotal-transfers)},
    reserve:{start:reserveBalance(`${Y-1}-12-31`).bal,zuf:transfers,zins:r2(sum(resTx.filter(x=>x.type==='Zinsen'),x=>num(x.amount))),entn:r2(sum(resTx.filter(x=>x.type==='Entnahme'),x=>num(x.amount))+sum(resPays,x=>x.amount)),end:reserveBalance(to).bal},
    forderungen:r2(sum(us,u=>Math.max(0,-hgStatus(u.id,Y).saldo))),verbindl:r2(sum(S.costs.filter(c=>+c.year<=Y&&restOf(c)>0),restOf)),unpaid};
}

     +`<div class="pb"></div>`+rptHead(`Vermögensbericht ${Y}`)+`<h2>Hausgeldkonto</h2>`+tbl([{l:'Position'},{l:'Betrag',n:1}],[['Anfangsbestand 01.01.',eur(j.bank.start)],['+ Einnahmen',eur(j.bank.rec)],['− Ausgaben',eur(j.bank.op)],['− Überweisungen an die Rücklage',eur(j.bank.transfers)]],['Endbestand 31.12. (rechnerisch)',eur(j.bank.end)])
     +`<h2>Erhaltungsrücklage</h2>`+tbl([{l:'Position'},{l:'Betrag',n:1}],[['Stand 01.01.',eur(j.reserve.start)],['+ Zuführungen',eur(j.reserve.zuf)],['+ Zinsen',eur(j.reserve.zins)],['− Entnahmen und Maßnahmen',eur(j.reserve.entn)]],['Stand 31.12.',eur(j.reserve.end)])
     +`<h2>Forderungen und Verbindlichkeiten</h2>`+tbl([{l:'Position'},{l:'Betrag',n:1}],[['Hausgeldrückstände',eur(j.forderungen)],['Offene Rechnungen',eur(j.verbindl)]]);
  }else{
    j.rows.forEach((r,i)=>{const u=r.u;

      +`<h2>Ihr Anteil an den Kosten</h2>`+tbl([{l:'Kostenart'},{l:'Schlüssel'},{l:'Gesamt',n:1},{l:'Ihr Anteil',n:1}],[...j.lines.map(l=>[esc(catName(l.catId)),esc(KEY_LABEL[catKey(l.catId)]),eur(l.amount),l.undist?'–':eur(l.shares[i])]),['Zuführung Erhaltungsrücklage','MEA',eur(j.zufTotal),eur(r.zuf)]],['Gesamtbelastung','',eur(r2(j.opTotal+j.zufTotal)),eur(r.total)])
      +`<h2>Ergebnis</h2>`+tbl([{l:'Position'},{l:'Betrag',n:1}],[['Gesamtbelastung',eur(r.total)],['− Hausgeldvorschüsse laut Wirtschaftsplan (Soll)',eur(r.soll)],['= Abrechnungsspitze',eur(r.spitze)],['Tatsächlich gezahltes Hausgeld',eur(r.ist)]],[r.ergebnis>0.005?'Nachzahlung':'Guthaben',eur(Math.abs(r.ergebnis))])
      +`<p>${r.ergebnis>0.005?`Die Nachzahlung wird nach Beschluss der Eigentümerversammlung fällig. Bitte überweisen Sie sie dann auf ${bankLine()}.`:r.ergebnis<-0.005?'Das Guthaben wird nach Beschluss der Eigentümerversammlung erstattet oder verrechnet.':'Es ergibt sich weder Nachzahlung noch Guthaben.'}</p>`
      +`<h2>Angaben für Vermietung und Steuer</h2>`+tbl([{l:'Position'},{l:'Ihr Anteil',n:1}],[['Davon umlagefähige Betriebskosten (je nach Mietvertrag)',eur(r.uml)],['Haushaltsnahe Dienstleistungen, Arbeitskosten (§ 35a Abs. 2 EStG)',eur(r.ld)],['Handwerkerleistungen, Arbeitskosten (§ 35a Abs. 3 EStG)',eur(r.lh)]])
      +`<p class="meta">Der Vermögensbericht und die Gesamtabrechnung liegen bei. Erstellt mit WEG Hausverwaltung.</p>`});
  }
  $('#printArea').innerHTML=h;setTimeout(()=>window.print(),50);
}

/* ---------- Versammlungen & Beschluss-Sammlung ---------- */
const topNo=t=>{const m=/^TOP\s*(\d+)/.exec(t||'');return m?+m[1]:999};
function sortedResolutions(){return S.resolutions.slice().sort((a,b)=>(a.date||'')<(b.date||'')?-1:(a.date||'')>(b.date||'')?1:topNo(a.title)-topNo(b.title))}
const DEFAULT_TOPS=['Begrüßung, Feststellung der ordnungsgemäßen Einladung','Bericht der Verwaltung','Beschluss über die Jahresabrechnung (Abrechnungsspitzen) des Vorjahres','Beschluss über den Wirtschaftsplan und die Hausgeldvorschüsse','Entlastung der Verwaltung','Instandhaltung und geplante Maßnahmen','Verschiedenes (keine Beschlussfassung)'];
function vMeetings(){
  const ms=S.meetings.slice().sort((a,b)=>a.date<b.date?1:-1);
  const rs=sortedResolutions();
  $('#main').innerHTML=`<div class="spread mb-top"><p class="small muted" style="margin:0;max-width:70ch">Einladung, Protokoll und Beschluss-Sammlung. Einladungen müssen mindestens drei Wochen vorher in Textform verschickt werden (§ 24 Abs. 4 WEG).</p><button class="btn pri" data-act="meetingForm">Versammlung planen</button></div>
  <div class="tbl-wrap">${ms.length?`<table><thead><tr><th>Datum</th><th>Versammlung</th><th class="hide-m">Einladung</th><th>Status</th><th></th></tr></thead><tbody>${ms.map(m=>{const d=daysUntil(m.date);return `<tr><td>${fd(m.date)}<div class="t-sub">${esc(m.time||'')}</div></td><td><div class="t-title">${m.type==='außerordentlich'?'Außerordentliche':'Ordentliche'} Eigentümerversammlung${demoB(m)}</div><div class="t-sub">${esc(m.place||'')} – ${(m.tops||[]).length} TOPs</div></td><td class="hide-m small">${m.inviteSentAt?`versendet ${fd(m.inviteSentAt)}`:m.status==='geplant'?(d>=21?`bis ${fd(addDays(m.date,-21))} versenden`:'<span style="color:var(--bad)">Frist unterschritten</span>'):'–'}</td><td>${m.status==='durchgeführt'?'<span class="badge b-ok">durchgeführt</span>':'<span class="badge b-info">geplant</span>'}</td><td><div class="row" style="gap:4px;flex-wrap:nowrap"><button class="btn sm" data-act="meetingForm" data-id="${m.id}">Bearbeiten</button><button class="btn sm" data-act="meetingInvite" data-id="${m.id}">Einladung</button><button class="btn sm pri" data-act="meetingMinutes" data-id="${m.id}">Protokoll</button></div></td></tr>`}).join('')}</tbody></table>`:'<div class="empty">Noch keine Versammlungen.<br><button class="btn pri" data-act="meetingForm">Versammlung planen</button></div>'}</div>
  <div class="panel" style="margin-top:16px"><div class="spread"><h2 style="margin:0">Beschluss-Sammlung (§ 24 Abs. 7 WEG)</h2><div class="row"><button class="btn sm" data-act="resEdit">Beschluss manuell erfassen</button><button class="btn sm" data-act="resPrint">Drucken / PDF</button></div></div>
   ${rs.length?`<div style="overflow-x:auto;margin-top:10px"><table><thead><tr><th class="num">Nr.</th><th>Datum</th><th>Beschluss</th><th>Ergebnis</th></tr></thead><tbody>${rs.map((x,i)=>`<tr class="click" data-act="resEdit" data-id="${x.id}"><td class="num">${i+1}</td><td>${fd(x.date)}</td><td><div class="t-title">${esc(x.title)}${demoB(x)}</div><div class="t-sub">${esc((x.text||'').slice(0,160))}${(x.text||'').length>160?' …':''}</div></td><td><span class="badge ${x.result==='angenommen'?'b-ok':x.result==='abgelehnt'?'b-bad':''}">${esc(x.result||'')}</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty small">Noch keine Beschlüsse. Beschlüsse aus Protokollen werden automatisch übernommen.</div>'}</div>`;
}
function meetingForm(id){
  const ex=id&&S.meetings.find(m=>m.id===id);
  const m=ex?structuredClone(ex):{date:addDays(today(),28),time:'19:00',place:'',type:'ordentlich',status:'geplant',tops:DEFAULT_TOPS.map(t=>({id:uid(),title:t,proposal:''})),attendees:[],chair:S.settings.verwName||'',minutes:'',inviteSentAt:''};
  const ov=openModal(ex?'Versammlung bearbeiten':'Versammlung planen',`<div class="form">
   <label class="f c2">Datum<input id="mD" type="date" value="${esc(m.date)}"></label><label class="f c2">Uhrzeit<input id="mT" type="time" value="${esc(m.time)}"></label><label class="f c2">Art<select id="mY">${opt('ordentlich','ordentlich',m.type)}${opt('außerordentlich','außerordentlich',m.type)}</select></label>
   <label class="f c4">Ort<input id="mP" value="${esc(m.place)}" placeholder="z. B. Gemeinschaftsraum, Musterstraße 12"></label><label class="f c2">Einladung versendet am<input id="mI" type="date" value="${esc(m.inviteSentAt||'')}"></label></div>
   <div id="mWarn" style="margin-top:8px"></div>
   <h3>Tagesordnung</h3><div id="topList"></div><button class="btn sm" id="topAdd" type="button" style="margin-top:8px">TOP hinzufügen</button>`,
   {wide:true,footer:`${ex?'<div class="left"><button class="btn danger" data-del>Löschen</button></div>':''}<button class="btn" data-no>Abbrechen</button><button class="btn pri" data-yes>Speichern</button>`});
  ov.dataset.sticky='1';
  const warn=()=>{const d=$('#mD',ov).value,dl=d?addDays(d,-21):'';$('#mWarn',ov).innerHTML=d&&!$('#mI',ov).value?(dl<today()?`<div class="notice bad"><div class="grow small">Die Drei-Wochen-Frist ist bereits unterschritten (Einladung hätte bis ${fd(dl)} raus sein müssen). Nur in besonderer Dringlichkeit zulässig.</div></div>`:`<div class="hint">Einladung spätestens am <b>${fd(dl)}</b> versenden.</div>`):''};
  $('#mD',ov).onchange=warn;$('#mI',ov).onchange=warn;warn();
  const draw=()=>{$('#topList',ov).innerHTML=m.tops.map((t,i)=>`<div class="doc" style="align-items:flex-start"><div class="ico" style="height:auto;padding:6px 0">TOP ${i+1}</div><div class="grow"><input class="inp" data-tt="${i}" value="${esc(t.title)}" placeholder="Titel" style="margin-bottom:6px"><textarea class="inp" data-tp="${i}" rows="2" placeholder="Beschlussvorschlag (leer lassen, wenn nur Information)">${esc(t.proposal||'')}</textarea></div><div style="display:flex;flex-direction:column;gap:2px"><button type="button" class="btn sm ghost" data-tu="${i}" aria-label="nach oben">▲</button><button type="button" class="btn sm ghost" data-td="${i}" aria-label="nach unten">▼</button><button type="button" class="btn sm ghost" data-tx="${i}" aria-label="entfernen">✕</button></div></div>`).join('');
    $$('[data-tt]',ov).forEach(e=>e.oninput=()=>m.tops[+e.dataset.tt].title=e.value);$$('[data-tp]',ov).forEach(e=>e.oninput=()=>m.tops[+e.dataset.tp].proposal=e.value);
    $$('[data-tu]',ov).forEach(b=>b.onclick=()=>{const i=+b.dataset.tu;if(i>0){[m.tops[i-1],m.tops[i]]=[m.tops[i],m.tops[i-1]];draw()}});
    $$('[data-td]',ov).forEach(b=>b.onclick=()=>{const i=+b.dataset.td;if(i<m.tops.length-1){[m.tops[i+1],m.tops[i]]=[m.tops[i],m.tops[i+1]];draw()}});
    $$('[data-tx]',ov).forEach(b=>b.onclick=()=>{m.tops.splice(+b.dataset.tx,1);draw()})};
  draw();$('#topAdd',ov).onclick=()=>{m.tops.push({id:uid(),title:'',proposal:''});draw();$$('[data-tt]',ov).pop().focus()};
  ov.querySelector('[data-no]').onclick=()=>closeModal(ov);ov.querySelector('[data-close]').onclick=()=>closeModal(ov);
  if(ex)ov.querySelector('[data-del]').onclick=async()=>{if(!await confirmBox('Versammlung löschen? Bereits übernommene Beschlüsse bleiben in der Beschluss-Sammlung.',{ok:'Löschen',danger:true}))return;await removeRec('meetings',m.id);closeModal(ov);render()};
  ov.querySelector('[data-yes]').onclick=async()=>{if(!$('#mD',ov).value)return toast('Bitte ein Datum angeben.',true);m.tops=m.tops.filter(t=>t.title.trim());
    Object.assign(m,{date:$('#mD',ov).value,time:$('#mT',ov).value,type:$('#mY',ov).value,place:$('#mP',ov).value.trim(),inviteSentAt:$('#mI',ov).value});await save('meetings',m);closeModal(ov);toast('Versammlung gespeichert');render()};
}
function meetingInvite(id){
  const m=S.meetings.find(x=>x.id===id);if(!m)return;
  const d=daysUntil(m.date);
  const go=()=>{$('#printArea').innerHTML=letterHead()+`<p style="text-align:right">${fd(today())}</p><h1>Einladung zur ${m.type==='außerordentlich'?'außerordentlichen':'ordentlichen'} Eigentümerversammlung</h1><div class="meta">${esc(S.settings.wegName||'')}</div>
    <p>Sehr geehrte Eigentümerinnen und Eigentümer,</p><p>hiermit lade ich Sie herzlich zur Eigentümerversammlung ein:</p>
    ${tbl([{l:''},{l:''}],[['Datum',`${fd(m.date)}, ${esc(m.time||'')} Uhr`],['Ort',esc(m.place||'–')]])}
    <h2>Tagesordnung</h2>${(m.tops||[]).map((t,i)=>`<p><b>TOP ${i+1}: ${esc(t.title)}</b>${t.proposal?`<br><span class="meta">Beschlussvorschlag:</span> ${esc(t.proposal).replace(/\n/g,'<br>')}`:''}</p>`).join('')}
    <p>Sollten Sie verhindert sein, können Sie sich durch eine Vollmacht in Textform vertreten lassen.</p><p>Mit freundlichen Grüßen</p><p style="margin-top:24pt">${esc(S.settings.verwName||'Verwaltung')}</p>
    <div class="pb"></div><h1>Vollmacht</h1><p>Ich/Wir, ______________________________, Eigentümer/in der Einheit ____________, bevollmächtige(n) hiermit ______________________________, mich/uns in der Eigentümerversammlung am ${fd(m.date)} zu vertreten und das Stimmrecht auszuüben.</p><div class="sig"><div>Ort, Datum</div><div>Unterschrift</div></div>`;
    setTimeout(()=>window.print(),50)};
  if(d<21&&!m.inviteSentAt){confirmBox(`Bis zur Versammlung sind es nur noch ${d} Tage. Die gesetzliche Einladungsfrist beträgt mindestens drei Wochen (§ 24 Abs. 4 WEG). Trotzdem drucken?`,{ok:'Trotzdem drucken'}).then(ok=>ok&&go())}else go();
}
function meetingMinutes(id){
  const m=structuredClone(S.meetings.find(x=>x.id===id));if(!m)return;const us=units();
  m.attendees=m.attendees||[];
  const ov=openModal(`Protokoll – Versammlung vom ${fd(m.date)}`,`<div class="form"><label class="f c3">Versammlungsleitung<input id="pC" value="${esc(m.chair||S.settings.verwName||'')}"></label><label class="f c3">Protokoll<input id="pW" value="${esc(m.writer||'')}"></label></div>
   <h3>Anwesenheit</h3><div class="row">${us.map(u=>`<label class="check" style="border:1px solid var(--line);border-radius:6px;padding:6px 10px"><input type="checkbox" data-at="${u.id}" ${m.attendees.includes(u.id)?'checked':''}> ${esc(unitLabel(u))} <span class="muted small">${fmtPm(u.mea)}</span></label>`).join('')}</div>
   <p class="hint">Jede ordnungsgemäß einberufene Versammlung ist beschlussfähig. Abgestimmt wird nach Köpfen, sofern die Gemeinschaftsordnung nichts anderes regelt (§ 25 WEG).</p>
   ${(m.tops||[]).map((t,i)=>`<div class="panel" style="margin-top:10px;padding:12px 14px"><b>TOP ${i+1}: ${esc(t.title)}</b>
    <div class="form" style="margin-top:8px"><label class="f c6">Beschlusstext / Ergebnis der Aussprache<textarea data-mt="${i}" rows="2">${esc(t.text??t.proposal??'')}</textarea></label>
    <label class="f" style="grid-column:span 1">Ja<input type="number" min="0" data-my="${i}" value="${esc(t.yes??'')}"></label><label class="f" style="grid-column:span 1">Nein<input type="number" min="0" data-mn="${i}" value="${esc(t.no??'')}"></label><label class="f" style="grid-column:span 1">Enth.<input type="number" min="0" data-ma="${i}" value="${esc(t.abst??'')}"></label>
    <label class="f c3">Ergebnis<select data-mr="${i}">${opt('','Information, kein Beschluss',t.result||'')}${opt('angenommen','Beschluss angenommen',t.result)}${opt('abgelehnt','Beschluss abgelehnt',t.result)}</select></label></div></div>`).join('')}`,
   {wide:true,footer:`<button class="btn" data-print>Protokoll drucken</button><button class="btn" data-no>Abbrechen</button><button class="btn pri" data-yes>Speichern</button>`});
  ov.dataset.sticky='1';
  $$('[data-my]',ov).forEach(e=>e.oninput=()=>{const i=e.dataset.my,y=num(e.value),n=num($(`[data-mn="${i}"]`,ov).value);if(e.value!=='')$(`[data-mr="${i}"]`,ov).value=y>n?'angenommen':'abgelehnt'});
  $$('[data-mn]',ov).forEach(e=>e.oninput=()=>{const i=e.dataset.mn,y=num($(`[data-my="${i}"]`,ov).value),n=num(e.value);$(`[data-mr="${i}"]`,ov).value=y>n?'angenommen':'abgelehnt'});
  const collect=()=>{m.chair=$('#pC',ov).value.trim();m.writer=$('#pW',ov).value.trim();m.attendees=$$('[data-at]',ov).filter(c=>c.checked).map(c=>c.dataset.at);
    m.tops.forEach((t,i)=>{t.text=$(`[data-mt="${i}"]`,ov).value.trim();t.yes=$(`[data-my="${i}"]`,ov).value;t.no=$(`[data-mn="${i}"]`,ov).value;t.abst=$(`[data-ma="${i}"]`,ov).value;t.result=$(`[data-mr="${i}"]`,ov).value})};
  const persist=async()=>{collect();m.status='durchgeführt';await save('meetings',m);
    for(const [i,t] of m.tops.entries()){const ex=S.resolutions.find(r=>r.meetingId===m.id&&r.topId===t.id);
      if(t.result){await save('resolutions',Object.assign(ex||{},{date:m.date,title:`TOP ${i+1}: ${t.title}`,text:t.text,result:t.result,meetingId:m.id,topId:t.id,isDemo:m.isDemo||ex?.isDemo||false}))}
      else if(ex)await removeRec('resolutions',ex.id)}};
  ov.querySelector('[data-no]').onclick=()=>closeModal(ov);ov.querySelector('[data-close]').onclick=()=>closeModal(ov);
  ov.querySelector('[data-yes]').onclick=async()=>{await persist();closeModal(ov);toast('Protokoll gespeichert, Beschlüsse übernommen');render()};
  ov.querySelector('[data-print]').onclick=async()=>{await persist();minutesPrint(m);render()};
}
